name: CI

# Pushes and PRs run a quick check: Linux with the oldest and newest supported Python.
# The full OS x Python matrix runs weekly, on release tags (called from release.yml),
# and on demand (Actions tab).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secrets and repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history for secrets
        run: gitleaks git --redact --verbose .
      - name: Block forbidden files
        run: git ls-files -z | xargs -0 python scripts/check_forbidden_files.py

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["3.12", "3.13", "3.14"]' || '["3.12", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: CLI smoke test
        run: uv run garmin-connect-personal-mcp --version

  schedule:
    name: Scheduler (${{ matrix.backend }})
    # Installs, runs and removes the daily sync with each OS's real scheduler.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: systemd }
          - { os: ubuntu-latest, backend: cron }
          - { os: windows-latest, backend: Task Scheduler }
          - { os: macos-latest, backend: launchd }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start a systemd user session
        if: matrix.backend == 'systemd'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done
      - name: Make sure there's no systemd user session (cron fallback)
        if: matrix.backend == 'cron'
        run: |
          which crontab || { sudo apt-get update && sudo apt-get install -y cron; }
          sudo loginctl disable-linger "$USER" || true
          echo "XDG_RUNTIME_DIR=" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent" >> "$GITHUB_ENV"
      - name: Install, run and remove the daily sync
        run: uv run python scripts/schedule_smoke.py "${{ matrix.backend }}"
