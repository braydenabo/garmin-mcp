<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin chart</title>
<!--
  MCP Apps view for garmin_show_chart. Self-contained: no external scripts,
  fonts or network requests. It receives the tool result from the host over
  postMessage (spec 2026-01-26) and draws an SVG chart.
-->
<style>
  :root {
    color-scheme: light;
    --bg: var(--color-background-primary, #ffffff);
    --text: var(--color-text-primary, #1f2328);
    --muted: var(--color-text-secondary, #59636e);
    --grid: var(--color-border-tertiary, #e6e8eb);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
    --primary: #0f8b8d;
    --deep: #3b4cca;
    --light: #7aa7ff;
    --rem: #a35bd6;
    --awake: #f2a541;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: var(--color-background-primary, #17191c);
    --text: var(--color-text-primary, #e6e8eb);
    --muted: var(--color-text-secondary, #9aa3ad);
    --grid: var(--color-border-tertiary, #2d3136);
    --primary: #3cc5c7;
    --deep: #6f7cf0;
    --light: #9cc0ff;
    --rem: #c58cf0;
    --awake: #f7bd66;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  main { padding: 14px 16px 12px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .sub { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { font-size: 10px; fill: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main id="app"><p class="sub">Loading chart…</p></main>
<script>
"use strict";

var W = 640, H = 260, PAD = { top: 10, right: 12, bottom: 28, left: 40 };
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function esc(text) {
  return String(text).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function parseDay(iso) {
  var p = iso.split("-");
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
}

function shortLabel(iso, count, bucket) {
  var d = parseDay(iso);
  if (bucket === "week") return MONTHS[d.getUTCMonth()] + " " + d.getUTCDate();
  if (count <= 14) return DAYS[d.getUTCDay()] + " " + d.getUTCDate();
  return MONTHS[d.getUTCMonth()] + " " + d.getUTCDate();
}

function fmt(v) {
  if (v === null || v === undefined) return "no data";
  return Math.abs(v) >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10);
}

function niceMax(v) {
  if (v <= 0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(v)));
  var steps = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= v) return steps[i] * mag;
  return 10 * mag;
}

function totals(data) {
  return data.labels.map(function (_, i) {
    var sum = null;
    data.series.forEach(function (s) {
      var v = s.values[i];
      if (v !== null && v !== undefined) sum = (sum || 0) + v;
    });
    return sum;
  });
}

// Pure: chart data in, SVG markup out. Tested with Node.
function renderChart(data) {
  var n = data.labels.length;
  var plotW = W - PAD.left - PAD.right, plotH = H - PAD.top - PAD.bottom;
  var stacked = data.kind === "stacked";
  var peaks = stacked ? totals(data) : data.series[0].values;
  var present = peaks.filter(function (v) { return v !== null && v !== undefined; });
  var lo = 0, hi = niceMax(present.length ? Math.max.apply(null, present) : 1);
  if (data.kind === "line" && present.length) {
    var min = Math.min.apply(null, present), span = Math.max.apply(null, present) - min;
    lo = Math.max(0, Math.floor((min - span * 0.25 - 1) / 5) * 5);
    hi = lo + niceMax(Math.max.apply(null, present) - lo + span * 0.1 + 1);
  }
  function y(v) { return PAD.top + plotH - ((v - lo) / (hi - lo)) * plotH; }
  var slot = plotW / Math.max(n, 1);
  function x(i) { return PAD.left + slot * (i + 0.5); }
  var out = [];
  out.push('<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    esc(data.title + ", " + data.start + " to " + data.end) + '">');
  for (var t = 0; t <= 4; t++) {
    var tv = lo + ((hi - lo) * t) / 4, ty = y(tv).toFixed(1);
    out.push('<line x1="' + PAD.left + '" x2="' + (W - PAD.right) + '" y1="' + ty + '" y2="' + ty +
      '" stroke="var(--grid)" stroke-width="1"/>');
    out.push('<text class="axis" x="' + (PAD.left - 6) + '" y="' + ty + '" dy="3" text-anchor="end">' +
      esc(fmt(tv)) + "</text>");
  }
  var every = Math.ceil(n / 10);
  data.labels.forEach(function (label, i) {
    // Every nth label, plus the last one when it isn't crowded by the one before it.
    var lastFits = i === n - 1 && (n - 1) % every >= Math.ceil(every / 2);
    if (i % every !== 0 && !lastFits) return;
    out.push('<text class="axis" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' +
      esc(shortLabel(label, n, data.bucket)) + "</text>");
  });
  var barW = Math.max(2, Math.min(36, slot * 0.62));
  if (data.kind === "line") {
    var vals = data.series[0].values, path = "", open = false;
    vals.forEach(function (v, i) {
      if (v === null || v === undefined) { open = false; return; }
      path += (open ? " L" : " M") + x(i).toFixed(1) + " " + y(v).toFixed(1);
      open = true;
    });
    if (path) out.push('<path d="' + path.trim() + '" fill="none" stroke="var(--primary)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>');
    vals.forEach(function (v, i) {
      if (v === null || v === undefined) return;
      out.push('<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.5" fill="var(--primary)">' +
        "<title>" + esc(data.labels[i] + ": " + fmt(v) + " " + data.unit) + "</title></circle>");
    });
  } else {
    data.labels.forEach(function (label, i) {
      var base = lo, tips = [];
      data.series.forEach(function (s) {
        var v = s.values[i];
        if (v !== null && v !== undefined) tips.push(s.name + " " + fmt(v));
      });
      data.series.forEach(function (s) {
        var v = s.values[i];
        if (v === null || v === undefined || v <= 0) return;
        var top = y(base + v), bottom = y(base);
        out.push('<rect x="' + (x(i) - barW / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' +
          barW.toFixed(1) + '" height="' + Math.max(0.5, bottom - top).toFixed(1) + '" rx="2" fill="var(--' +
          esc(stacked ? s.role : "primary") + ')"><title>' +
          esc(label + ": " + (stacked ? tips.join(", ") + " (" + data.unit + ")" : fmt(v) + " " + data.unit)) +
          "</title></rect>");
        base += v;
      });
    });
  }
  if (data.average !== null && data.average !== undefined && present.length > 1) {
    var ay = y(data.average).toFixed(1);
    out.push('<line x1="' + PAD.left + '" x2="' + (W - PAD.right) + '" y1="' + ay + '" y2="' + ay +
      '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"><title>Average ' +
      esc(fmt(data.average) + " " + data.unit) + "</title></line>");
  }
  out.push("</svg>");
  return out.join("");
}

function renderView(data) {
  var parts = [];
  parts.push("<h1>" + esc(data.title) + "</h1>");
  var sub = data.start + " to " + data.end + " · " + data.unit;
  if (data.average !== null && data.average !== undefined) sub += " · average " + fmt(data.average);
  parts.push('<p class="sub">' + esc(sub) + "</p>");
  parts.push(renderChart(data));
  if (data.kind === "stacked") {
    parts.push('<div class="legend">' + data.series.map(function (s) {
      return '<span><i style="background:var(--' + esc(s.role) + ')"></i>' + esc(s.name) + "</span>";
    }).join("") + "</div>");
  }
  data.notes.forEach(function (note) { parts.push('<p class="note">' + esc(note) + "</p>"); });
  parts.push('<table class="sr"><tr><th>Date</th>' + data.series.map(function (s) {
    return "<th>" + esc(s.name) + "</th>";
  }).join("") + "</tr>" + data.labels.map(function (label, i) {
    return "<tr><td>" + esc(label) + "</td>" + data.series.map(function (s) {
      return "<td>" + esc(fmt(s.values[i])) + "</td>";
    }).join("") + "</tr>";
  }).join("") + "</table>");
  return parts.join("");
}

// --- MCP Apps protocol (host <-> view over postMessage) ---

var nextId = 1, pending = {}, lastData = null;

function send(message) { window.parent.postMessage(message, "*"); }

function request(method, params) {
  var id = nextId++;
  send({ jsonrpc: "2.0", id: id, method: method, params: params });
  return new Promise(function (resolve, reject) { pending[id] = { resolve: resolve, reject: reject }; });
}

function notify(method, params) { send({ jsonrpc: "2.0", method: method, params: params || {} }); }

function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.setAttribute("data-theme", ctx.theme);
  var vars = ctx.styles && ctx.styles.variables;
  if (vars) Object.keys(vars).forEach(function (k) {
    if (vars[k]) document.documentElement.style.setProperty(k, vars[k]);
  });
}

function show(data) {
  lastData = data;
  document.getElementById("app").innerHTML = renderView(data);
}

function reportSize() {
  var el = document.documentElement;
  notify("ui/notifications/size-changed", { width: el.scrollWidth, height: el.scrollHeight });
}

function start() {
  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var msg = event.data || {};
    if (msg.id !== undefined && pending[msg.id] && !msg.method) {
      var p = pending[msg.id]; delete pending[msg.id];
      if (msg.error) p.reject(new Error(msg.error.message || "error")); else p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      var data = msg.params && msg.params.structuredContent;
      if (data && data.labels) show(data);
      else document.getElementById("app").innerHTML = '<p class="sub">No chart data in this result.</p>';
    } else if (msg.method === "ui/notifications/host-context-changed") {
      applyContext(msg.params);
      if (lastData) show(lastData);
    }
  });
  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(document.documentElement);
  request("ui/initialize", {
    appInfo: { name: "garmin-chart", version: "1" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  }).then(function (result) {
    applyContext(result && result.hostContext);
    notify("ui/notifications/initialized");
  }, function () {
    notify("ui/notifications/initialized");
  });
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { renderChart: renderChart, renderView: renderView, niceMax: niceMax, shortLabel: shortLabel };
} else {
  start();
}
</script>
</body>
</html>
